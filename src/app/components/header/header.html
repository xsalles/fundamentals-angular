<p>{{ titleHeader }}</p>
<!-- Here I'm interpolating the title defined in .ts file -->
<h1 [innerText]="'My text'"></h1>
<!-- Here I'm using property binding to set the innerText of the h1 element statically -->

<h1 [innerText]="subTitle"></h1>
<!-- Here I'm using property binding to set the innerText of the h1 element dynamically -->

<h1>{{ subTitle }}</h1>
<!-- Here I'm using property binding to set the innerText of the h1 element dynamically in a easier way -->

<button (click)="handleClick()">Update</button>
<!-- It's called event binding, when I change one property, the other one updates automatically -->
